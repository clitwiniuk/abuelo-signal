# Configuración de conexión a IBKR
ibkr:
  host: "127.0.0.1"
  port: 7497
  client_id: 1
  timeout: 30

# Configuración de gestión de riesgo
risk:
  # Límites generales
  max_position_size_pct: 10.0  # Porcentaje máximo del capital por posición
  max_strategy_risk_pct: 30.0  # Porcentaje máximo del capital por estrategia
  max_daily_loss_pct: 2.0      # Pérdida diaria máxima permitida (% del capital)
  max_leverage: 3.0            # Apalancamiento máximo permitido
  max_orders_per_day: 100       # Número máximo de órdenes por día
  
  # Configuración de horario de trading (en hora local)
  trading_hours:
    enabled: true
    start: "09:30"
    end: "16:00"
    timezone: "America/New_York"
  
  # Símbolos bloqueados
  blacklist:
    - "TSLA"
    - "GME"
    - "AMC"
    - "BB"
    - "NOK"

  # Estrategias configuradas
  strategies:
    mean_reversion_1h:
      max_position_size_pct: 15.0  # Sobreescribe el valor general
      max_strategy_risk_pct: 40.0  # Sobreescribe el valor general
      
    momentum_daily:
      max_position_size_pct: 5.0
      max_strategy_risk_pct: 20.0

# Configuración de logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: "order_executor.log"
  max_size_mb: 10
  backup_count: 5

# Configuración de notificaciones (opcional)
notifications:
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    username: "tu_email@gmail.com"
    password: "tu_contraseña"
    recipients:
      - "tu_email@dominio.com"
  
  slack:
    enabled: false
    webhook_url: "https://hooks.slack.com/services/..."
    channel: "#trading-alerts"

# Configuración de base de datos (opcional)
database:
  enabled: true
  type: "sqlite"  # Opciones: sqlite, postgresql, mysql
  sqlite_file: "trading.db"
  
  # Solo necesario para bases de datos remotas
  host: "localhost"
  port: 5432
  name: "trading_db"
  user: "user"
  password: "password"
