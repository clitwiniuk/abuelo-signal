# ========================================
# SISTEMA_III - Trading System Configuration
# Simple smallcaps trading without ML
# ========================================

[IBKR]
host = 127.0.0.1
port = 7497
client_id_scanner = 1001
client_id_execution = 1010
client_id_gap_worker = 1003
client_id_daily_worker = 1004
client_id_macdv_worker = 1005
client_id_bull_flag_worker = 1006

[SYSTEM]
timezone = America/New_York
log_level = INFO
log_directory = logs/
database_path = shared/positions.db

[TRADING]
# System mode: PRODUCTION or MOCK
active_profile = PRODUCTION

[MARKET_SESSIONS]
market_open = 09:30
market_close = 16:00
premarket_start = 04:00
aftermarket_end = 20:00

# Trading windows
entry_start = 09:30
entry_end = 15:30
exit_before_close = 15:57

# Data collection settings
use_extended_hours_data = True
execute_only_regular_hours = True

[SCANNER]
scan_interval_seconds = 30
max_candidates_per_cycle = 20
min_price = 1.0
max_price = 15.0
min_volume = 100000
min_market_cap_millions = 50
max_market_cap_millions = 2000

# Scanner detection rules
enable_intraday_momentum = true
enable_daily_bounce = true
enable_red_to_green = true
enable_bull_flag = true

[RISK_MANAGER]
max_portfolio_risk = 0.02
max_positions = 10
max_position_size = 200
min_position_size = 100
max_daily_trades = 20
max_daily_loss = -200.0
portfolio_capital = 2000

# Per-trade risk
max_risk_per_trade = 0.015
position_sizing_method = FIXED

# Position monitoring and recovery
position_check_interval_seconds = 60
max_position_age_hours = 24

[EXECUTION_ENGINE]
order_timeout_seconds = 60
max_slippage_percent = 0.5
use_market_orders = false
enable_bracket_orders = true

# Recovery settings
enable_startup_recovery = true
position_sync_interval_seconds = 300
verify_orders_on_startup = true

[WORKERS]
# How many workers of each type to run
gap_go_workers = 1
daily_plays_workers = 1
macdv_workers = 1
bull_flag_workers = 1

# Worker subscription filters (fixed to match worker code)
gap_go_opportunity_types = GAP_GO
daily_plays_opportunity_types = DAILY_PLAYS
macdv_opportunity_types = MACDV
bull_flag_opportunity_types = BULL_FLAG

[STRATEGY_GAP_GO]
min_gap_percent = 2.0
max_gap_percent = 8.0
min_volume_ratio = 2.0
max_volume_ratio = 10.0
min_price_trend_duration = 5
stop_loss_percent = 0.03
take_profit_percent = 0.06

[STRATEGY_DAILY_PLAYS]
min_volume_ratio = 4.0
min_news_sentiment = 0.6
max_gap_percent = 15.0
min_consolidation_minutes = 30
stop_loss_percent = 0.04
take_profit_percent = 0.08

[STRATEGY_MACDV]
# Baseline technical strategy
min_volume_ratio = 1.5
macd_signal_threshold = 0.02
volume_confirmation_periods = 3
stop_loss_percent = 0.025
take_profit_percent = 0.05

[STRATEGY_BULL_FLAG]
min_flag_duration_minutes = 15
max_flag_duration_minutes = 120
min_pole_height_percent = 3.0
max_consolidation_range_percent = 2.0
volume_breakout_multiplier = 1.8
stop_loss_percent = 0.03
take_profit_percent = 0.06

[DATABASE]
# SQLite coordination database
positions_table = positions
reservations_table = reservations
opportunities_table = opportunities

# Cleanup intervals
cleanup_old_opportunities_hours = 24
cleanup_old_reservations_hours = 2

[COMMUNICATION]
# Redis configuration
redis_host = localhost
redis_port = 6379
redis_db = 0
redis_password =

# Message channels
scanner_channel = scanner_opportunities
execution_channel = execution_commands
workers_status_channel = workers_status

# Message timeouts
message_timeout_seconds = 10
heartbeat_interval_seconds = 30

[MONITORING]
enable_performance_monitoring = true
save_trade_history = true
enable_position_monitoring = true
monitoring_interval_seconds = 60

# Health checks
scanner_health_check_seconds = 120
worker_health_check_seconds = 90
execution_health_check_seconds = 60

[NOTIFICATIONS]
# Telegram notifications
telegram_enabled = true
telegram_bot_token = 8016189611:AAEu3BdG90c4HLStsUFNFFeMjpPfiKlnkrY
telegram_chat_id = 5038045991

# Notification filters
notification_cooldown_seconds = 300
enable_notification_filter = true

# What to notify
notify_new_opportunities = true
notify_trade_executions = true
notify_position_closes = true
notify_risk_alerts = true
notify_system_status = true
notify_errors = true

# Notification levels
min_quality_score_notify = 75.0
min_gap_percent_notify = 2.0
min_volume_ratio_notify = 2.0