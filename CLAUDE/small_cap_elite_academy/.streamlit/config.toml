[theme]
primaryColor = "#00C805"
backgroundColor = "#0A0A0A"
secondaryBackgroundColor = "#141414"
textColor = "#FFFFFF"
font = "sans-serif"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[logger]
level = "info"

[runner]
magicEnabled = true
fastReruns = true

