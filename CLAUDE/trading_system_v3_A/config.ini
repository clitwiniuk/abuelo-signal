# ═══════════════════════════════════════════════════════════════════════════
# MOMENTUM INDICATOR SELECTION (ROC vs VWAP Slope)
# ═══════════════════════════════════════════════════════════════════════════
# Choose between ROC (Rate of Change) or VWAP Slope for momentum detection
#
# WHY ROC?
# - VWAP slope is context-dependent (shows different values based on WHEN evaluated)
# - ROC shows CURRENT momentum regardless of evaluation time
# - More consistent between simulation and production
# - Only needs 5-6 bars of data vs 10+ for VWAP
#
# use_roc_momentum: True = Use ROC, False = Use VWAP Slope (original)
use_roc_momentum = true

# ROC Settings (only used if use_roc_momentum = true)
# roc_period: Number of bars to look back (5 bars = 5 minutes for 1min timeframe)
roc_period = 5
# roc_min_threshold: Minimum ROC percentage required (0.1% = slight upward momentum)
roc_min_threshold = 0.1

# VWAP Slope Settings (only used if use_roc_momentum = false)
# min_vwap_slope: Minimum VWAP slope (very small positive = any uptrend)
min_vwap_slope = 0.0001

# ═══════════════════════════════════════════════════════════════════════════
# SUPPORT BOUNCE STRATEGY (NEW)
# ═══════════════════════════════════════════════════════════════════════════
# Optimal entry: Buy at support bounces with VWAP momentum
# Better R:R by entering at support with tight SL below support level
#
# support_detection_lookback: How many bars to analyze for support (20-30 recommended)
# support_proximity_threshold: Max distance to support to consider "near" (5% = within 5% of support)
# support_bounce_bars: How many bars must be rising to confirm bounce (3 recommended)
# min_quality_no_support: Minimum quality score needed if NOT at support (75 = very high catalyst)
# optimal_sl_below_support_pct: SL distance below support level (2% recommended)
#
support_detection_lookback = 30
support_proximity_threshold = 5.0
support_bounce_bars = 3
min_quality_no_support = 75.0
