<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Replay Viewer - EEG Style</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    <style>
        body {
            font-family: 'Monaco', 'Courier New', monospace;
            background-color: #0a0e27;
            color: #00ff41;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #1a1f3a 0%, #0f1629 100%);
            border-radius: 10px;
            border: 2px solid #00ff41;
        }

        .header h1 {
            margin: 0 0 10px 0;
            font-size: 32px;
            text-shadow: 0 0 10px #00ff41;
        }

        .trade-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            padding: 20px;
            background: #1a1f3a;
            border-radius: 8px;
            border: 1px solid #00ff41;
        }

        .info-item {
            padding: 10px;
            background: #0f1629;
            border-radius: 5px;
            border-left: 3px solid #00ff41;
        }

        .info-label {
            font-size: 11px;
            color: #888;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 16px;
            font-weight: bold;
        }

        .profit {
            color: #00ff41;
        }

        .loss {
            color: #ff4444;
        }

        .chart-container {
            position: relative;
            height: 600px;
            background: #0f1629;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #00ff41;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            padding: 20px;
            background: #1a1f3a;
            border-radius: 8px;
            border: 1px solid #00ff41;
        }

        .control-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #00ff41 0%, #00cc33 100%);
            color: #0a0e27;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.6);
        }

        .control-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .speed-control label {
            font-size: 14px;
        }

        .speed-control input {
            width: 120px;
        }

        .timeline {
            padding: 15px;
            background: #1a1f3a;
            border-radius: 8px;
            border: 1px solid #00ff41;
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .annotations {
            margin-top: 20px;
            padding: 20px;
            background: #1a1f3a;
            border-radius: 8px;
            border: 1px solid #00ff41;
        }

        .annotations h3 {
            margin-top: 0;
            color: #00ff41;
        }

        .annotation-item {
            padding: 10px;
            margin: 8px 0;
            background: #0f1629;
            border-radius: 5px;
            border-left: 3px solid;
        }

        .annotation-entry {
            border-left-color: #00ff41;
        }

        .annotation-exit {
            border-left-color: #ff4444;
        }

        .annotation-sl {
            border-left-color: #ff8800;
        }

        .annotation-tp {
            border-left-color: #00aaff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 TRADE REPLAY VIEWER</h1>
            <p>Visualización tipo Electroencefalograma - Trading System v3</p>
        </div>

        <div class="trade-info" id="tradeInfo">
            <!-- Will be populated by JavaScript -->
        </div>

        <div class="timeline" id="timeline">
            Cargando datos...
        </div>

        <div class="controls">
            <button class="control-btn" id="playBtn">▶ Play</button>
            <button class="control-btn" id="pauseBtn" disabled>⏸ Pause</button>
            <button class="control-btn" id="resetBtn">↺ Reset</button>
            <div class="speed-control">
                <label>Velocidad:</label>
                <input type="range" id="speedSlider" min="1" max="100" value="10" step="1">
                <span id="speedValue">10x</span>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="priceChart"></canvas>
        </div>

        <div class="annotations" id="annotations">
            <h3>📝 Eventos del Trade</h3>
            <div id="annotationsList">
                <!-- Will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // Trade data will be injected here
        const TRADE_DATA_PLACEHOLDER = {
            trade_id: "1000094",
            symbol: "PAVS",
            worker_name: "buy_and_hold",
            entry_price: 2.2101,
            exit_price: 2.16,
            stop_loss_price: 2.080968,
            take_profit_price: 2.62918,
            entry_time: "2025-12-26 20:52:17",
            exit_time: "2025-12-26 21:58:01",
            bars: [] // Will be loaded from data
        };

        let chart;
        let currentBar = 0;
        let isPlaying = false;
        let playInterval;
        let allBars = [];
        let visibleBars = [];

        function initChart() {
            const ctx = document.getElementById('priceChart').getContext('2d');

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Precio',
                        data: [],
                        borderColor: '#00ff41',
                        backgroundColor: 'rgba(0, 255, 65, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.1,
                        pointRadius: 0,
                        pointHoverRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'minute',
                                displayFormats: {
                                    minute: 'HH:mm'
                                }
                            },
                            grid: {
                                color: 'rgba(0, 255, 65, 0.1)'
                            },
                            ticks: {
                                color: '#00ff41'
                            }
                        },
                        y: {
                            position: 'right',
                            grid: {
                                color: 'rgba(0, 255, 65, 0.1)'
                            },
                            ticks: {
                                color: '#00ff41',
                                callback: function(value) {
                                    return '$' + value.toFixed(3);
                                }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        annotation: {
                            annotations: {
                                stopLoss: {
                                    type: 'line',
                                    yMin: TRADE_DATA_PLACEHOLDER.stop_loss_price,
                                    yMax: TRADE_DATA_PLACEHOLDER.stop_loss_price,
                                    borderColor: '#ff4444',
                                    borderWidth: 2,
                                    borderDash: [5, 5],
                                    label: {
                                        display: true,
                                        content: `SL: $${TRADE_DATA_PLACEHOLDER.stop_loss_price.toFixed(3)} (-${((1 - TRADE_DATA_PLACEHOLDER.stop_loss_price/TRADE_DATA_PLACEHOLDER.entry_price) * 100).toFixed(1)}%)`,
                                        position: 'start',
                                        backgroundColor: 'rgba(255, 68, 68, 0.8)',
                                        color: '#fff',
                                        font: {
                                            size: 11,
                                            weight: 'bold'
                                        }
                                    }
                                },
                                takeProfit: {
                                    type: 'line',
                                    yMin: TRADE_DATA_PLACEHOLDER.take_profit_price,
                                    yMax: TRADE_DATA_PLACEHOLDER.take_profit_price,
                                    borderColor: '#00aaff',
                                    borderWidth: 2,
                                    borderDash: [5, 5],
                                    label: {
                                        display: true,
                                        content: `TP: $${TRADE_DATA_PLACEHOLDER.take_profit_price.toFixed(3)} (+${((TRADE_DATA_PLACEHOLDER.take_profit_price/TRADE_DATA_PLACEHOLDER.entry_price - 1) * 100).toFixed(1)}%)`,
                                        position: 'start',
                                        backgroundColor: 'rgba(0, 170, 255, 0.8)',
                                        color: '#fff',
                                        font: {
                                            size: 11,
                                            weight: 'bold'
                                        }
                                    }
                                },
                                entryPrice: {
                                    type: 'line',
                                    yMin: TRADE_DATA_PLACEHOLDER.entry_price,
                                    yMax: TRADE_DATA_PLACEHOLDER.entry_price,
                                    borderColor: '#ffaa00',
                                    borderWidth: 2,
                                    borderDash: [10, 5],
                                    label: {
                                        display: true,
                                        content: `ENTRY: $${TRADE_DATA_PLACEHOLDER.entry_price.toFixed(3)}`,
                                        position: 'center',
                                        backgroundColor: 'rgba(255, 170, 0, 0.8)',
                                        color: '#000',
                                        font: {
                                            size: 11,
                                            weight: 'bold'
                                        }
                                    }
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const price = context.parsed.y;
                                    const pnl = ((price / TRADE_DATA_PLACEHOLDER.entry_price - 1) * 100).toFixed(2);
                                    return [
                                        `Precio: $${price.toFixed(3)}`,
                                        `P&L: ${pnl > 0 ? '+' : ''}${pnl}%`
                                    ];
                                }
                            }
                        }
                    }
                }
            });
        }

        function updateTradeInfo() {
            const pnl = ((TRADE_DATA_PLACEHOLDER.exit_price / TRADE_DATA_PLACEHOLDER.entry_price - 1) * 100).toFixed(2);
            const pnlClass = pnl >= 0 ? 'profit' : 'loss';

            const duration = Math.floor((new Date(TRADE_DATA_PLACEHOLDER.exit_time) - new Date(TRADE_DATA_PLACEHOLDER.entry_time)) / 60000);

            document.getElementById('tradeInfo').innerHTML = `
                <div class="info-item">
                    <div class="info-label">TRADE ID</div>
                    <div class="info-value">${TRADE_DATA_PLACEHOLDER.trade_id}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">SYMBOL</div>
                    <div class="info-value">${TRADE_DATA_PLACEHOLDER.symbol}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">WORKER</div>
                    <div class="info-value">${TRADE_DATA_PLACEHOLDER.worker_name}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">ENTRY PRICE</div>
                    <div class="info-value">$${TRADE_DATA_PLACEHOLDER.entry_price.toFixed(3)}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">EXIT PRICE</div>
                    <div class="info-value">$${TRADE_DATA_PLACEHOLDER.exit_price.toFixed(3)}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">P&L</div>
                    <div class="info-value ${pnlClass}">${pnl > 0 ? '+' : ''}${pnl}%</div>
                </div>
                <div class="info-item">
                    <div class="info-label">STOP LOSS</div>
                    <div class="info-value">$${TRADE_DATA_PLACEHOLDER.stop_loss_price.toFixed(3)} (-${((1 - TRADE_DATA_PLACEHOLDER.stop_loss_price/TRADE_DATA_PLACEHOLDER.entry_price) * 100).toFixed(1)}%)</div>
                </div>
                <div class="info-item">
                    <div class="info-label">TAKE PROFIT</div>
                    <div class="info-value">$${TRADE_DATA_PLACEHOLDER.take_profit_price.toFixed(3)} (+${((TRADE_DATA_PLACEHOLDER.take_profit_price/TRADE_DATA_PLACEHOLDER.entry_price - 1) * 100).toFixed(1)}%)</div>
                </div>
                <div class="info-item">
                    <div class="info-label">DURATION</div>
                    <div class="info-value">${Math.floor(duration / 60)}h ${duration % 60}m</div>
                </div>
            `;
        }

        function loadAnnotations() {
            const entryTime = new Date(TRADE_DATA_PLACEHOLDER.entry_time);
            const exitTime = new Date(TRADE_DATA_PLACEHOLDER.exit_time);

            document.getElementById('annotationsList').innerHTML = `
                <div class="annotation-item annotation-entry">
                    <strong>🟢 ENTRADA</strong><br>
                    ${entryTime.toLocaleString('es-ES')}<br>
                    Precio: $${TRADE_DATA_PLACEHOLDER.entry_price.toFixed(3)}<br>
                    Worker: ${TRADE_DATA_PLACEHOLDER.worker_name}
                </div>
                <div class="annotation-item annotation-sl">
                    <strong>🔴 STOP LOSS</strong><br>
                    Nivel: $${TRADE_DATA_PLACEHOLDER.stop_loss_price.toFixed(3)} (-${((1 - TRADE_DATA_PLACEHOLDER.stop_loss_price/TRADE_DATA_PLACEHOLDER.entry_price) * 100).toFixed(1)}%)<br>
                    Límite inferior del worker
                </div>
                <div class="annotation-item annotation-tp">
                    <strong>🔵 TAKE PROFIT</strong><br>
                    Nivel: $${TRADE_DATA_PLACEHOLDER.take_profit_price.toFixed(3)} (+${((TRADE_DATA_PLACEHOLDER.take_profit_price/TRADE_DATA_PLACEHOLDER.entry_price - 1) * 100).toFixed(1)}%)<br>
                    Límite superior del worker
                </div>
                <div class="annotation-item annotation-exit">
                    <strong>⚫ SALIDA</strong><br>
                    ${exitTime.toLocaleString('es-ES')}<br>
                    Precio: $${TRADE_DATA_PLACEHOLDER.exit_price.toFixed(3)}<br>
                    P&L: ${((TRADE_DATA_PLACEHOLDER.exit_price / TRADE_DATA_PLACEHOLDER.entry_price - 1) * 100).toFixed(2)}%
                </div>
            `;
        }

        function play() {
            if (currentBar >= allBars.length) {
                currentBar = 0;
                visibleBars = [];
                chart.data.labels = [];
                chart.data.datasets[0].data = [];
                // Limpiar marcadores de entry/exit
                if (chart.options.plugins.annotation.annotations.entryMarker) {
                    delete chart.options.plugins.annotation.annotations.entryMarker;
                }
                if (chart.options.plugins.annotation.annotations.exitMarker) {
                    delete chart.options.plugins.annotation.annotations.exitMarker;
                }
            }

            isPlaying = true;
            document.getElementById('playBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;

            const speed = parseInt(document.getElementById('speedSlider').value);
            const delay = Math.max(10, 200 - speed * 2);

            playInterval = setInterval(() => {
                if (currentBar < allBars.length) {
                    const bar = allBars[currentBar];
                    visibleBars.push(bar);

                    const barTime = new Date(bar.timestamp);
                    chart.data.labels.push(barTime);
                    chart.data.datasets[0].data.push(bar.close);

                    // Marcar punto de entrada
                    const entryTime = new Date(TRADE_DATA_PLACEHOLDER.entry_time);
                    if (Math.abs(barTime - entryTime) < 120000) { // 2 minutos de tolerancia
                        chart.options.plugins.annotation.annotations.entryMarker = {
                            type: 'point',
                            xValue: barTime,
                            yValue: bar.close,
                            backgroundColor: '#00ff41',
                            borderColor: '#00ff41',
                            borderWidth: 3,
                            radius: 8,
                            label: {
                                display: true,
                                content: '🟢 ENTRADA',
                                position: 'top',
                                backgroundColor: 'rgba(0, 255, 65, 0.9)',
                                color: '#000',
                                font: {
                                    size: 12,
                                    weight: 'bold'
                                }
                            }
                        };
                    }

                    // Marcar punto de salida
                    const exitTime = new Date(TRADE_DATA_PLACEHOLDER.exit_time);
                    if (Math.abs(barTime - exitTime) < 120000) { // 2 minutos de tolerancia
                        chart.options.plugins.annotation.annotations.exitMarker = {
                            type: 'point',
                            xValue: barTime,
                            yValue: bar.close,
                            backgroundColor: '#ff4444',
                            borderColor: '#ff4444',
                            borderWidth: 3,
                            radius: 8,
                            label: {
                                display: true,
                                content: '🔴 SALIDA',
                                position: 'top',
                                backgroundColor: 'rgba(255, 68, 68, 0.9)',
                                color: '#fff',
                                font: {
                                    size: 12,
                                    weight: 'bold'
                                }
                            }
                        };
                    }

                    chart.update('none');

                    updateTimeline(bar);
                    currentBar++;
                } else {
                    pause();
                }
            }, delay);
        }

        function pause() {
            isPlaying = false;
            clearInterval(playInterval);
            document.getElementById('playBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
        }

        function reset() {
            pause();
            currentBar = 0;
            visibleBars = [];
            chart.data.labels = [];
            chart.data.datasets[0].data = [];
            chart.update();
            document.getElementById('timeline').textContent = 'Presiona Play para comenzar';
        }

        function updateTimeline(bar) {
            const time = new Date(bar.timestamp).toLocaleTimeString('es-ES');
            const price = bar.close;
            const pnl = ((price / TRADE_DATA_PLACEHOLDER.entry_price - 1) * 100).toFixed(2);
            const pnlClass = pnl >= 0 ? 'profit' : 'loss';

            // Calcular distancia a límites
            const distanceToSL = ((price / TRADE_DATA_PLACEHOLDER.stop_loss_price - 1) * 100).toFixed(2);
            const distanceToTP = ((TRADE_DATA_PLACEHOLDER.take_profit_price / price - 1) * 100).toFixed(2);

            let status = '';
            if (price <= TRADE_DATA_PLACEHOLDER.stop_loss_price) {
                status = '<span style="color: #ff4444;">⚠️ PRECIO FUERA DEL WORKER (SL ALCANZADO)</span>';
            } else if (price >= TRADE_DATA_PLACEHOLDER.take_profit_price) {
                status = '<span style="color: #00aaff;">✅ PRECIO FUERA DEL WORKER (TP ALCANZADO)</span>';
            } else {
                status = `<span style="color: #00ff41;">✓ Precio dentro de límites | SL: ${distanceToSL}% | TP: +${distanceToTP}%</span>`;
            }

            document.getElementById('timeline').innerHTML = `
                <strong>${time}</strong> |
                Precio: <span class="info-value">$${price.toFixed(3)}</span> |
                P&L: <span class="${pnlClass}">${pnl > 0 ? '+' : ''}${pnl}%</span> |
                Barra ${currentBar} de ${allBars.length}
                <br>${status}
            `;
        }

        document.getElementById('speedSlider').addEventListener('input', function() {
            document.getElementById('speedValue').textContent = this.value + 'x';
            if (isPlaying) {
                pause();
                play();
            }
        });

        document.getElementById('playBtn').addEventListener('click', play);
        document.getElementById('pauseBtn').addEventListener('click', pause);
        document.getElementById('resetBtn').addEventListener('click', reset);

        // Initialize
        window.addEventListener('load', function() {
            
        const TRADE_DATA = {
            trade_id: "1000094",
            symbol: "PAVS",
            worker_name: "buy_and_hold",
            entry_price: 2.2101,
            exit_price: 2.16,
            stop_loss_price: 2.080968,
            take_profit_price: 2.6291800000000003,
            entry_time: "2025-12-26 20:52:17.446032",
            exit_time: "2025-12-26 21:58:01.875723",
